version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sach_ai_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PORT=8000
      - HOST=0.0.0.0
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80
      - DATABASE_URL=sqlite:///./sach_ai.db
      - LLM_PROVIDER=offline_demo
      - STT_ENGINE=local_speech_recognition
      - TTS_ENGINE=gtts
    volumes:
      - sach_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sach_ai_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sach_data:
